<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YZC69</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #050505;
}

body {
    overflow: hidden;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* =====================================================
   LIVE CINEMATIC FOG / SMOKE
   ===================================================== */

.smoke {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
    opacity: 1;
}

.fog-sheet {
    position: absolute;
    inset: -20%;
    background:
        radial-gradient(ellipse at 18% 28%,
            rgba(230,230,230,.20) 0%,
            rgba(170,170,170,.10) 18%,
            transparent 42%),
        radial-gradient(ellipse at 82% 34%,
            rgba(220,220,220,.18) 0%,
            rgba(160,160,160,.08) 20%,
            transparent 44%),
        radial-gradient(ellipse at 50% 78%,
            rgba(210,210,210,.14) 0%,
            rgba(150,150,150,.06) 20%,
            transparent 46%),
        radial-gradient(ellipse at 45% 48%,
            rgba(190,190,190,.07) 0%,
            transparent 45%);

    filter: blur(28px);
    mix-blend-mode: screen;
    animation: fogFlow 22s ease-in-out infinite alternate;
}

.fog-sheet.two {
    inset: -30%;
    background:
        radial-gradient(ellipse at 30% 58%,
            rgba(245,245,245,.15) 0%,
            rgba(180,180,180,.07) 18%,
            transparent 40%),
        radial-gradient(ellipse at 72% 18%,
            rgba(235,235,235,.16) 0%,
            rgba(170,170,170,.07) 18%,
            transparent 42%),
        radial-gradient(ellipse at 58% 88%,
            rgba(220,220,220,.12) 0%,
            transparent 38%);

    filter: blur(40px);
    opacity: .8;
    animation: fogFlow2 29s ease-in-out infinite alternate;
}

.fog-ribbon {
    position: absolute;
    width: 125%;
    height: 38%;
    left: -12%;
    top: 18%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(235,235,235,.16) 0%,
            rgba(190,190,190,.08) 24%,
            rgba(120,120,120,.025) 48%,
            transparent 72%
        );

    filter: blur(32px);
    mix-blend-mode: screen;
    opacity: .85;

    animation: ribbonMove 17s ease-in-out infinite alternate;
}

.fog-ribbon.bottom {
    top: auto;
    bottom: -4%;
    opacity: .65;
    animation-duration: 24s;
    animation-direction: alternate-reverse;
}

@keyframes fogFlow {
    0% {
        transform: translate3d(-5%, 4%, 0) scale(.95) rotate(-1deg);
        opacity: .55;
    }
    50% {
        transform: translate3d(4%, -5%, 0) scale(1.05) rotate(1deg);
        opacity: .95;
    }
    100% {
        transform: translate3d(10%, 3%, 0) scale(1.0) rotate(2deg);
        opacity: .70;
    }
}

@keyframes fogFlow2 {
    0% {
        transform: translate3d(8%, -4%, 0) scale(.9);
        opacity: .35;
    }
    50% {
        transform: translate3d(-7%, 5%, 0) scale(1.08);
        opacity: .80;
    }
    100% {
        transform: translate3d(-12%, -3%, 0) scale(.96);
        opacity: .45;
    }
}

@keyframes ribbonMove {
    0% {
        transform: translate3d(-8%, 8%, 0) scale(.85) rotate(-3deg);
    }
    50% {
        transform: translate3d(7%, -4%, 0) scale(1.08) rotate(2deg);
    }
    100% {
        transform: translate3d(-3%, 7%, 0) scale(.94) rotate(-1deg);
    }
}

/* New vertical YZC69 image */
.container {
    position: relative;
    z-index: 2;

    width: 100vw;
    height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    background: #050505;
}

.brand-logo {
    display: block;
    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center;

    background: #050505;

    filter:
        drop-shadow(0 0 18px rgba(255,255,255,.06))
        drop-shadow(0 0 45px rgba(0,0,0,.65));

    animation: logoAppear 1.6s ease-out both;
}

@keyframes logoAppear {
    from {
        opacity: 0;
        transform: scale(1.025);
        filter: blur(7px) brightness(.75);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter:
            blur(0)
            drop-shadow(0 0 18px rgba(255,255,255,.06))
            drop-shadow(0 0 45px rgba(0,0,0,.65));
    }
}

/* Mobile first */
@media (max-width: 768px) {
    .container {
        width: 100vw;
        height: 100dvh;
        min-height: 100dvh;
    }

    .brand-logo {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: contain;
    }

    .smoke {
        inset: -25%;
    }

    .smoke {
        opacity: 1;
    }

    .fog-sheet {
        filter: blur(22px);
    }

    .fog-sheet.two {
        filter: blur(30px);
    }

    .fog-ribbon {
        filter: blur(25px);
    }
}

@media (max-width: 400px) {
    .fog-sheet,
    .fog-sheet.two {
        opacity: .9;
    }
}

@media (max-width: 900px) and (orientation: landscape) {
    .brand-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
}

/* YouTube background player */
.youtube-player {
    position: fixed;
    width: 1px;
    height: 1px;
    left: -10px;
    bottom: -10px;
    opacity: 0;
    pointer-events: none;
}
</style>

</head>

<body>

<div class="smoke" aria-hidden="true">
    <div class="fog-sheet"></div>
    <div class="fog-sheet two"></div>
    <div class="fog-ribbon"></div>
    <div class="fog-ribbon bottom"></div>
</div>

<div class="container">
    <img
        src="yzc69-logo.png"
        alt="YZC69 Luxury Car Boutique & Real Estate"
        class="brand-logo"
    >
</div>

<iframe
    class="youtube-player"
    src="https://www.youtube.com/embed/XMo6aye_6TA?autoplay=1&loop=1&playlist=XMo6aye_6TA&controls=0&mute=0"
    frameborder="0"
    allow="autoplay; encrypted-media"
></iframe>

</body>
</html>
