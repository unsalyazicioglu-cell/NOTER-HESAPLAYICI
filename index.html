<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YZC69</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#050505;
font-family:'Michroma',sans-serif;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;

}

body:before{

content:"";
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#ffffff18,transparent 70%);
filter:blur(30px);
animation:move1 12s infinite alternate;

}

body:after{

content:"";
position:absolute;
width:600px;
height:600px;
background:radial-gradient(circle,#ffffff10,transparent 70%);
right:-150px;
bottom:-150px;
filter:blur(40px);
animation:move2 14s infinite alternate;

}

@keyframes move1{

0%{transform:translate(-150px,-100px);}
100%{transform:translate(150px,100px);}

}

@keyframes move2{

0%{transform:translate(80px,100px);}
100%{transform:translate(-100px,-80px);}

}

.container{

text-align:center;
position:relative;
z-index:2;

}

.logo{

font-size:90px;
letter-spacing:18px;
font-weight:600;
color:white;
text-shadow:
0 0 10px rgba(255,255,255,.4),
0 0 25px rgba(255,255,255,.25);

animation:glow 3s infinite;

}

@keyframes glow{

0%,100%{

text-shadow:
0 0 10px rgba(255,255,255,.25),
0 0 30px rgba(255,255,255,.15);

}

50%{

text-shadow:
0 0 20px rgba(255,255,255,.6),
0 0 60px rgba(255,255,255,.3);

}

}

.line{

width:180px;
height:1px;
background:white;
margin:35px auto;
opacity:.3;

}

.subtitle{

font-size:12px;
letter-spacing:8px;
color:#bdbdbd;

}

.footer{

position:absolute;
bottom:35px;
left:50%;
transform:translateX(-50%);
font-size:10px;
letter-spacing:6px;
opacity:.35;

}

.grid{

position:absolute;
width:100%;
height:100%;
background:
linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);

background-size:70px 70px;

animation:grid 12s linear infinite;

}

@keyframes grid{

from{

transform:translateY(0);

}

to{

transform:translateY(70px);

}

}

</style>

</head>

<body>

<div class="grid"></div>

<div class="container">

<div class="logo">
YZC69
</div>

<div class="line"></div>

<div class="subtitle">
ONLY LUXURY CAR BOUTIQUE & REAL ESTATE
</div>

</div>

<div class="footer">

ISTANBUL • EST. 2026

</div>

</body>
</html>
