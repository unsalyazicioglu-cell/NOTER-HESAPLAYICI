<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YZC69</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #050505;
    font-family: 'Michroma', sans-serif;
    overflow: hidden;
    height: 100vh;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    position: relative;
}

/* Arka plan ışıkları */

body::before {
    content: "";
    position: absolute;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, #ffffff18, transparent 70%);
    filter: blur(30px);
    animation: move1 12s infinite alternate;
    pointer-events: none;
}

body::after {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, #ffffff10, transparent 70%);
    right: -150px;
    bottom: -150px;
    filter: blur(40px);
    animation: move2 14s infinite alternate;
    pointer-events: none;
}

@keyframes move1 {
    0% {
        transform: translate(-150px, -100px);
    }

    100% {
        transform: translate(150px, 100px);
    }
}

@keyframes move2 {
    0% {
        transform: translate(80px, 100px);
    }

    100% {
        transform: translate(-100px, -80px);
    }
}

/* Ana içerik */

.container {
    text-align: center;
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1200px;
    padding: 0 30px;
}

/* Logo */

.logo {
    font-size: 90px;
    letter-spacing: 18px;
    font-weight: 600;
    color: white;

    text-shadow:
        0 0 10px rgba(255,255,255,.4),
        0 0 25px rgba(255,255,255,.25);

    animation: glow 3s infinite;

    white-space: nowrap;
}

@keyframes glow {

    0%,
    100% {
        text-shadow:
            0 0 10px rgba(255,255,255,.25),
            0 0 30px rgba(255,255,255,.15);
    }

    50% {
        text-shadow:
            0 0 20px rgba(255,255,255,.6),
            0 0 60px rgba(255,255,255,.3);
    }
}

/* Çizgi */

.line {
    width: 180px;
    height: 1px;
    background: white;
    margin: 35px auto;
    opacity: .3;
}

/* Alt başlık */

.subtitle {
    font-size: 12px;
    letter-spacing: 8px;
    color: #bdbdbd;
    line-height: 1.8;
}

/* Footer */

.footer {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);

    font-size: 10px;
    letter-spacing: 6px;
    opacity: .35;

    white-space: nowrap;
    z-index: 2;
}

/* Grid */

.grid {
    position: absolute;
    width: 100%;
    height: 100%;
    inset: 0;

    background:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);

    background-size: 70px 70px;

    animation: grid 12s linear infinite;

    pointer-events: none;
}

@keyframes grid {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(70px);
    }
}


/* =====================================================
   MOBİL
   ===================================================== */

@media (max-width: 768px) {

    body {
        min-height: 100dvh;
        height: 100dvh;
    }

    .container {
        padding: 0 20px;
    }

    .logo {
        font-size: clamp(48px, 17vw, 72px);
        letter-spacing: clamp(8px, 3vw, 14px);
    }

    .line {
        width: 120px;
        margin: 25px auto;
    }

    .subtitle {
        font-size: clamp(8px, 2.5vw, 11px);
        letter-spacing: clamp(3px, 1.5vw, 6px);
        line-height: 2;
        max-width: 100%;
    }

    .footer {
        bottom: 22px;
        width: 100%;
        text-align: center;
        font-size: 8px;
        letter-spacing: 3px;
        padding: 0 15px;
    }

    body::before {
        width: 450px;
        height: 450px;
        filter: blur(25px);
    }

    body::after {
        width: 400px;
        height: 400px;
        filter: blur(30px);
        right: -180px;
        bottom: -180px;
    }

    .grid {
        background-size: 50px 50px;
    }
}


/* =====================================================
   KÜÇÜK TELEFONLAR
   ===================================================== */

@media (max-width: 400px) {

    .container {
        padding: 0 15px;
    }

    .logo {
        font-size: 48px;
        letter-spacing: 7px;
    }

    .line {
        width: 100px;
        margin: 22px auto;
    }

    .subtitle {
        font-size: 7px;
        letter-spacing: 2.5px;
        line-height: 2.2;
    }

    .footer {
        bottom: 18px;
        font-size: 7px;
        letter-spacing: 2px;
    }

}


/* =====================================================
   YATAY TELEFON
   ===================================================== */

@media (max-width: 900px) and (orientation: landscape) {

    .container {
        transform: scale(.75);
    }

    .footer {
        bottom: 10px;
    }

}

</style>

</head>

<body>

<div class="grid"></div>

<div class="container">

    <div class="logo">
        YZC69
    </div>

    <div class="line"></div>

    <div class="subtitle">
        ONLY LUXURY CAR BOUTIQUE &amp; REAL ESTATE
    </div>

</div>

<div class="footer">
    ISTANBUL • EST. 2026
</div>

</body>
</html>
