<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YZC69</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #050505;
}

body {
    overflow: hidden;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* Animated smoke environment */
.smoke {
    position: fixed;
    inset: -15%;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
}

.smoke::before,
.smoke::after {
    content: "";
    position: absolute;
    width: 65vw;
    height: 65vw;
    min-width: 420px;
    min-height: 420px;
    max-width: 950px;
    max-height: 950px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at 35% 65%,
            rgba(210,210,210,.10) 0%,
            rgba(170,170,170,.055) 18%,
            rgba(110,110,110,.025) 35%,
            transparent 68%
        );

    filter: blur(38px);
    opacity: .65;
    mix-blend-mode: screen;
}

.smoke::before {
    left: -18%;
    top: 5%;
    animation: smokeLeft 18s ease-in-out infinite alternate;
}

.smoke::after {
    right: -18%;
    top: 18%;
    animation: smokeRight 22s ease-in-out infinite alternate;
}

.smoke-cloud {
    position: absolute;
    width: 55vw;
    height: 55vw;
    min-width: 350px;
    min-height: 350px;
    max-width: 800px;
    max-height: 800px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center,
            rgba(220,220,220,.075) 0%,
            rgba(150,150,150,.035) 24%,
            transparent 68%
        );

    filter: blur(42px);
    opacity: .55;
    mix-blend-mode: screen;
}

.smoke-cloud.one {
    left: 12%;
    top: -18%;
    animation: smokeUp 20s ease-in-out infinite alternate;
}

.smoke-cloud.two {
    right: 5%;
    top: 38%;
    animation: smokeDrift 24s ease-in-out infinite alternate;
}

.smoke-cloud.three {
    left: 22%;
    bottom: -25%;
    animation: smokeBottom 19s ease-in-out infinite alternate;
}

@keyframes smokeLeft {
    0% {
        transform: translate3d(-8%, 7%, 0) scale(.85) rotate(-8deg);
    }
    50% {
        transform: translate3d(12%, -5%, 0) scale(1.08) rotate(5deg);
    }
    100% {
        transform: translate3d(25%, -14%, 0) scale(.92) rotate(12deg);
    }
}

@keyframes smokeRight {
    0% {
        transform: translate3d(10%, 10%, 0) scale(1);
    }
    50% {
        transform: translate3d(-12%, -8%, 0) scale(1.12);
    }
    100% {
        transform: translate3d(-28%, 4%, 0) scale(.9);
    }
}

@keyframes smokeUp {
    0% {
        transform: translate3d(-5%, 18%, 0) scale(.9);
        opacity: .3;
    }
    50% {
        transform: translate3d(8%, -5%, 0) scale(1.12);
        opacity: .65;
    }
    100% {
        transform: translate3d(-3%, -24%, 0) scale(.95);
        opacity: .4;
    }
}

@keyframes smokeDrift {
    0% {
        transform: translate3d(12%, 0, 0) scale(.85);
        opacity: .25;
    }
    50% {
        transform: translate3d(-8%, -10%, 0) scale(1.15);
        opacity: .6;
    }
    100% {
        transform: translate3d(-20%, 12%, 0) scale(.95);
        opacity: .3;
    }
}

@keyframes smokeBottom {
    0% {
        transform: translate3d(0, 18%, 0) scale(.9);
        opacity: .25;
    }
    50% {
        transform: translate3d(7%, -8%, 0) scale(1.12);
        opacity: .5;
    }
    100% {
        transform: translate3d(-8%, -20%, 0) scale(1);
        opacity: .3;
    }
}

/* New vertical YZC69 image */
.container {
    position: relative;
    z-index: 2;

    width: 100vw;
    height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    background: #050505;
}

.brand-logo {
    display: block;
    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center;

    background: #050505;

    filter:
        drop-shadow(0 0 18px rgba(255,255,255,.06))
        drop-shadow(0 0 45px rgba(0,0,0,.65));

    animation: logoAppear 1.6s ease-out both;
}

@keyframes logoAppear {
    from {
        opacity: 0;
        transform: scale(1.025);
        filter: blur(7px) brightness(.75);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter:
            blur(0)
            drop-shadow(0 0 18px rgba(255,255,255,.06))
            drop-shadow(0 0 45px rgba(0,0,0,.65));
    }
}

/* Mobile first */
@media (max-width: 768px) {
    .container {
        width: 100vw;
        height: 100dvh;
        min-height: 100dvh;
    }

    .brand-logo {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: contain;
    }

    .smoke {
        inset: -25%;
    }

    .smoke-cloud {
        opacity: .48;
        filter: blur(34px);
    }
}

@media (max-width: 400px) {
    .smoke-cloud {
        opacity: .42;
    }
}

@media (max-width: 900px) and (orientation: landscape) {
    .brand-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
}

/* YouTube background player */
.youtube-player {
    position: fixed;
    width: 1px;
    height: 1px;
    left: -10px;
    bottom: -10px;
    opacity: 0;
    pointer-events: none;
}
</style>

</head>

<body>

<div class="smoke">
    <div class="smoke-cloud one"></div>
    <div class="smoke-cloud two"></div>
    <div class="smoke-cloud three"></div>
</div>

<div class="container">
    <img
        src="yzc69-logo.png"
        alt="YZC69 Luxury Car Boutique & Real Estate"
        class="brand-logo"
    >
</div>

<iframe
    class="youtube-player"
    src="https://www.youtube.com/embed/XMo6aye_6TA?autoplay=1&loop=1&playlist=XMo6aye_6TA&controls=0&mute=0"
    frameborder="0"
    allow="autoplay; encrypted-media"
></iframe>

</body>
</html>
