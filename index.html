<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YZC69</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #050505;
}

body {
    overflow: hidden;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* =====================================================
   LIVE CINEMATIC FOG / SMOKE — SVG TURBULENCE
   ===================================================== */

.smoke {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
}

.smoke-svg {
    position: absolute;
    inset: -8%;
    width: 116%;
    height: 116%;
    opacity: .62;
    mix-blend-mode: screen;
    filter: blur(2px);
}

.smoke-svg .fog-a {
    opacity: .52;
}

.smoke-svg .fog-b {
    opacity: .34;
}

@keyframes fogFadeIn {
    from { opacity: 0; }
    to { opacity: .62; }
}

.smoke-svg {
    animation: fogFadeIn 2.8s ease-out both;
}

@media (max-width: 768px) {
    .smoke-svg {
        inset: -12%;
        width: 124%;
        height: 124%;
        opacity: .68;
    }
}

@media (max-width: 400px) {
    .smoke-svg {
        opacity: .72;
    }
}

/* New vertical YZC69 image */
.container {
    position: relative;
    z-index: 5;

    width: 100vw;
    height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    background: #050505;
}

.brand-logo {
    display: block;
    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center;

    background: #050505;

    filter:
        drop-shadow(0 0 18px rgba(255,255,255,.06))
        drop-shadow(0 0 45px rgba(0,0,0,.65));

    animation: logoAppear 1.6s ease-out both;
}

@keyframes logoAppear {
    from {
        opacity: 0;
        transform: scale(1.025);
        filter: blur(7px) brightness(.75);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter:
            blur(0)
            drop-shadow(0 0 18px rgba(255,255,255,.06))
            drop-shadow(0 0 45px rgba(0,0,0,.65));
    }
}

/* Mobile first */
@media (max-width: 768px) {
    .container {
        width: 100vw;
        height: 100dvh;
        min-height: 100dvh;
    }

    .brand-logo {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: contain;
    }

    .smoke {
        inset: -25%;
    }

    .smoke {
        opacity: 1;
    }

    .fog-sheet {
        filter: blur(22px);
    }

    .fog-sheet.two {
        filter: blur(30px);
    }

    .fog-ribbon {
        filter: blur(25px);
    }
}

@media (max-width: 400px) {
    .fog-sheet,
    .fog-sheet.two {
        opacity: .9;
    }
}

@media (max-width: 900px) and (orientation: landscape) {
    .brand-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
}

/* YouTube background player */
.youtube-player {
    position: fixed;
    width: 1px;
    height: 1px;
    left: -10px;
    bottom: -10px;
    opacity: 0;
    pointer-events: none;
}

/* REAL VIDEO SMOKE OVERLAY */
.smoke-video {
    position: fixed;
    inset: 0;
    z-index: 4;
    width: 100vw;
    height: 100dvh;
    object-fit: cover;
    object-position: center;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: .58;
    filter: blur(.25px);
}

@media (max-width: 768px) {
    .smoke-video {
        opacity: .62;
        object-fit: cover;
    }
}

</style>

</head>

<body>


    <div class="fog-sheet two"></div>
    <div class="fog-ribbon"></div>
    <div class="fog-ribbon bottom"></div>
</div>

<video
    class="smoke-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
    aria-hidden="true">
    <source src="yzc69-smoke.mp4" type="video/mp4">
</video>

<div class="container">
    <img
        src="yzc69-logo.png"
        alt="YZC69 Luxury Car Boutique & Real Estate"
        class="brand-logo"
    >
</div>

<iframe
    class="youtube-player"
    src="https://www.youtube.com/embed/XMo6aye_6TA?autoplay=1&loop=1&playlist=XMo6aye_6TA&controls=0&mute=0"
    frameborder="0"
    allow="autoplay; encrypted-media"
></iframe>

</body>
</html>
