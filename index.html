<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YZC69</title>

<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #050505;
}

body {
    overflow: hidden;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* Yeni dikey YZC69 görseli */
.container {
    position: relative;
    z-index: 2;

    width: 100vw;
    height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    background: #050505;
}

.brand-logo {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center;

    /* Görselin siyah kenarlarını siteyle aynı tona yaklaştırır */
    background: #050505;

    /* Hafif sinematik yumuşaklık */
    filter:
        drop-shadow(0 0 18px rgba(255,255,255,.06))
        drop-shadow(0 0 45px rgba(0,0,0,.65));

    animation: logoAppear 1.6s ease-out both;
}

@keyframes logoAppear {
    from {
        opacity: 0;
        transform: scale(1.025);
        filter: blur(7px) brightness(.75);
    }

    to {
        opacity: 1;
        transform: scale(1);
        filter:
            blur(0)
            drop-shadow(0 0 18px rgba(255,255,255,.06))
            drop-shadow(0 0 45px rgba(0,0,0,.65));
    }
}

/* Çok uzun iPhone ekranlarında da tam yüksekliği koru */
@media (max-width: 768px) {
    .container {
        width: 100vw;
        height: 100dvh;
        min-height: 100dvh;
    }

    .brand-logo {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;

        object-fit: contain;
        object-position: center;
    }
}

/* Küçük telefonlar */
@media (max-width: 400px) {
    .brand-logo {
        object-fit: contain;
    }
}

/* Yatay telefon */
@media (max-width: 900px) and (orientation: landscape) {
    .brand-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
}

/* YouTube arka plan oynatıcısı */
.youtube-player {
    position: fixed;
    width: 1px;
    height: 1px;
    left: -10px;
    bottom: -10px;
    opacity: 0;
    pointer-events: none;
}
</style>

</head>

<body>

<div class="container">
    <img
        src="yzc69-logo.png"
        alt="YZC69 Luxury Car Boutique & Real Estate"
        class="brand-logo"
    >
</div>

<iframe
    class="youtube-player"
    src="https://www.youtube.com/embed/XMo6aye_6TA?autoplay=1&loop=1&playlist=XMo6aye_6TA&controls=0&mute=0"
    frameborder="0"
    allow="autoplay; encrypted-media"
></iframe>

</body>
</html>
