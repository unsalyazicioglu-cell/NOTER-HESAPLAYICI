<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"

>

<title>YZC69 Luxury</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}


/* =========================
   VIDEO
========================= */

.intro-video {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100dvh;

    display: block;

    object-fit: cover;
    object-position: center;

    background: #000;

    z-index: 1;
}


/* =========================
   HAFİF VİDEO OVERLAY
   Logonun okunmasını sağlar
========================= */

.video-overlay {

    position: fixed;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.12) 0%,
            rgba(0,0,0,0.00) 45%,
            rgba(0,0,0,0.18) 100%
        );

    z-index: 2;

    pointer-events: none;
}


/* =========================
   YZC69 PNG LOGO
========================= */

.brand-logo {

    position: fixed;

    z-index: 10;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 84vw;

    max-width: 720px;

    height: auto;

    display: block;

    pointer-events: none;

    user-select: none;

    /* Hafif sinematik gölge */
    filter:
        drop-shadow(0 4px 14px rgba(0,0,0,0.75))
        drop-shadow(0 0 20px rgba(0,0,0,0.20));

    /* Açılış animasyonu */
    opacity: 0;

    animation:
        logoAppear 1.8s ease-out forwards;

}


/* =========================
   LOGO AÇILIŞ ANİMASYONU
========================= */

@keyframes logoAppear {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0.96);

        filter:
            blur(4px)
            drop-shadow(0 4px 14px rgba(0,0,0,0.75));

    }

    100% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);

        filter:
            blur(0)
            drop-shadow(0 4px 14px rgba(0,0,0,0.75))
            drop-shadow(0 0 20px rgba(0,0,0,0.20));

    }

}


/* =========================
   MOBİL
========================= */

@media (max-width: 600px) {

    .brand-logo {

        width: 88vw;

        max-width: none;

    }

}


/* =========================
   ÇOK KÜÇÜK TELEFONLAR
========================= */

@media (max-width: 380px) {

    .brand-logo {

        width: 90vw;

    }

}


/* =========================
   YATAY TELEFON
========================= */

@media (
    max-height: 500px
) and (
    orientation: landscape
) {

    .brand-logo {

        width: 65vw;

    }

}


/* =========================
   GÜVENLİ ALAN
   iPhone Dynamic Island / Home bar
========================= */

@supports (
    padding: env(safe-area-inset-top)
) {

    .brand-logo {

        margin-top:
            calc(
                env(safe-area-inset-top) * 0.05
            );

    }

}

</style>

</head>

<body>

<!-- =========================
     ANA VİDEO
========================= -->

<video
 class="intro-video"
 autoplay
 muted
 loop
 playsinline
 preload="auto">

```
<source
    src="yzc69-intro-loop.mp4"
    type="video/mp4">
```

</video>

<!-- =========================
     HAFİF KARARTMA
========================= -->

<div class="video-overlay"></div>

<!-- =========================
     YZC69 LOGO
========================= -->

<div class="brand-logo"></div>

     ARKA PLAN MÜZİĞİ
========================= -->

    position: fixed;
    width: 1px;

    left: -10px;

    pointer-events: none;
"

src="https://www.youtube.com/embed/XMo6aye_6TA?autoplay=1&loop=1&playlist=XMo6aye_6TA&controls=0"

title="YZC69 Music"

frameborder="0"

```

</iframe>

</body>
